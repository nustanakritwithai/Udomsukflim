services:
  - type: web
    name: udomsukfilm53
    runtime: static
    # ไฟล์ static อยู่ที่ root ของ repo อยู่แล้ว
    staticPublishPath: .
    # ไม่มี build step (เป็น HTML/CSS/JS ล้วน)
    buildCommand: ""
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /
        destination: /index.html
